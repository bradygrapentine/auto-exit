name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-and-docs-from-chatgpt/engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code-and-docs-from-chatgpt/engine-ts/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests
        run: npm test
