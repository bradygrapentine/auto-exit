name: mcp-smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code-and-docs-from-chatgpt/engine-ts/src/**'
      - 'code-and-docs-from-chatgpt/engine-ts/scripts/**'
      - 'code-and-docs-from-chatgpt/engine-ts/test/harness/**'
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-and-docs-from-chatgpt/engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: code-and-docs-from-chatgpt/engine-ts/package-lock.json }
      - run: npm ci
      - name: write credentials
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_PROD_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PROD_PRIVATE_KEY }}
        run: |
          mkdir -p $HOME/.kalshi-exit-assistant
          echo "$KALSHI_PRIVATE_KEY" > $HOME/.kalshi-exit-assistant/prod.pem
          chmod 600 $HOME/.kalshi-exit-assistant/prod.pem
          # Use env-fallback path: smoke runs against env vars when no credentials.json present.
          echo "KALSHI_ACCESS_KEY=$KALSHI_ACCESS_KEY" >> $GITHUB_ENV
          echo "KALSHI_PRIVATE_KEY_PATH=$HOME/.kalshi-exit-assistant/prod.pem" >> $GITHUB_ENV
      - run: npm run smoke:mcp

  harness:
    needs: smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: code-and-docs-from-chatgpt/engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: code-and-docs-from-chatgpt/engine-ts/package-lock.json }
      - run: npm ci
      - name: write credentials
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_PROD_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PROD_PRIVATE_KEY }}
        run: |
          mkdir -p $HOME/.kalshi-exit-assistant
          echo "$KALSHI_PRIVATE_KEY" > $HOME/.kalshi-exit-assistant/prod.pem
          chmod 600 $HOME/.kalshi-exit-assistant/prod.pem
          echo "KALSHI_ACCESS_KEY=$KALSHI_ACCESS_KEY" >> $GITHUB_ENV
          echo "KALSHI_PRIVATE_KEY_PATH=$HOME/.kalshi-exit-assistant/prod.pem" >> $GITHUB_ENV
      - run: npm run harness:read-only
      - name: commit updated latency p95
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        run: |
          if git diff --quiet test/harness/latency/p95.json; then exit 0; fi
          git config user.name "harness-bot"
          git config user.email "harness@local"
          git add test/harness/latency/p95.json
          git commit -m "chore(harness): update latency p95 [skip ci]"
          git push
